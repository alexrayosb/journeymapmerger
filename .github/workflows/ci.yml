# Quality gates on every push and pull request:
#   checks  npm run check = typecheck + lint + unit tests + build
#   e2e     Playwright against a local preview of the built site, in
#           Chromium and Firefox (real merges of synthetic fixtures, error
#           states, network silence). Not part of the deploy gate: the
#           Cloudflare build image has no browsers.
#
# Deploys are NOT done here. Cloudflare's git integration (Workers Builds)
# builds `main` with the same `npm run check` and deploys the assets-only
# Worker, so a red gate never reaches the live site.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run fixtures -- small
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
